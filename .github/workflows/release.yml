name: release

permissions:
  contents: read

on:
  push:
    tags:
      - v[0-9]+.*

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # for taiki-e/create-gh-release-action
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          # Linux: static binaries (musl), cross-compiled
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
          # macOS: both architectures, built on macOS runners
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Windows: MSVC
          - target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    permissions:
      contents: write # for taiki-e/upload-rust-binary-action
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: endsWith(matrix.target, '-musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: azar
          target: ${{ matrix.target }}
          tar: unix
          zip: windows
          checksum: sha256
          include: README.md,LICENSE

  publish:
    needs: upload-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io (skipped when token absent)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN not set — skipping crates.io publish"
            exit 0
          fi
          cargo publish --locked
