[package]
name = "azar"
version = "0.1.0"
edition = "2021"
description = "Random identifier generator: bech32m (BIP-350), base58, base64, hex"
license = "MIT"
repository = "https://github.com/aficiomaquinas/azar"
keywords = ["bech32", "bech32m", "base58", "identifier", "random"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
base64 = "0.22"
getrandom = "0.3"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
proptest = "1"

[profile.release]
lto = true
strip = true
